name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Niente android-actions/setup-android: il runner ha già l'SDK Android
      # e Gradle scarica da solo la piattaforma 35 se manca.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Leggi la versione (semVer)
        id: ver
        run: |
          V=$(grep -oP 'val semVer = "\K[^"]+' app/build.gradle.kts)
          echo "semver=$V" >> "$GITHUB_OUTPUT"
          echo "Versione: $V - build ${GITHUB_RUN_NUMBER}"

      - name: Prepara keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zooplayer.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/zooplayer.jks" >> "$GITHUB_ENV"
            echo "Firma con il keystore dei secrets"
          else
            echo "::warning::Secret KEYSTORE_BASE64 assente: APK firmato con chiave di debug temporanea. Gli aggiornamenti richiederanno di disinstallare l'app. Vedi README."
          fi

      - name: Compila
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ZooPlayer_v${{ steps.ver.outputs.semver }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ZooPlayer_v${{ steps.ver.outputs.semver }}
          path: out/*.apk

      - name: Pubblica release (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
