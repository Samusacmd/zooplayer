name: Genera keystore (da eseguire UNA volta)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Crea keystore
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore zooplayer.jks -alias zooplayer -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=ZooPlayer"
          mkdir out
          base64 -w0 zooplayer.jks > out/KEYSTORE_BASE64.txt
          echo -n "$PASS" > out/KEYSTORE_PASSWORD_e_KEY_PASSWORD.txt
          echo -n "zooplayer" > out/KEY_ALIAS.txt
          cp zooplayer.jks out/
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-CANCELLAMI-DOPO-AVERLO-COPIATO
          path: out
          retention-days: 1
